<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-labelledby="title desc">
  <title id="title">After one unfold</title>
  <desc id="desc">Opening the vertical fold reflects the cut quarter to make a 240-by-120-unit rectangle with a centered triangular notch on its bottom folded edge. B marks the original square's center at the middle of that edge. Dashed blue lines track the fold axes.</desc>
  <rect width="300" height="220" fill="white"/>
  <text x="150" y="30" font-family="Georgia, serif" font-size="19" fill="#111827" text-anchor="middle">After one unfold</text>
  <path d="M30 60 H270 V180 H210 L150 120 L90 180 H30 Z" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 180 H270 M150 60 V180" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M90 180 L150 120 L210 180" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="150" cy="180" r="3" fill="#2563eb"/>
  <text x="158" y="200" font-family="Georgia, serif" font-size="19" fill="#111827">B</text>
</svg>
