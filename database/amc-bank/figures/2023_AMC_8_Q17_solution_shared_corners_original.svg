<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="title desc">
  <title id="title">Two shared corners of the octahedron net</title>
  <desc id="desc">An octahedron net has faces 1, 3, 4, 5, 6 and Q in a horizontal strip, face 7 above face 6, and face 2 below face 3. Corner A is shared by Q, 6 and 7. Corner B is shared by 2, 3, 4 and 5.</desc>
  <rect width="680" height="470" fill="white"/>
  <g fill="#f8fafc" stroke="#111827" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="50,150 200,150 125,279.904"/>
    <polygon points="125,279.904 200,150 275,279.904"/>
    <polygon points="200,150 350,150 275,279.904"/>
    <polygon points="275,279.904 350,150 425,279.904"/>
    <polygon points="350,150 500,150 425,279.904"/>
    <polygon points="425,279.904 500,150 575,279.904" fill="#e2e8f0"/>
    <polygon points="350,150 500,150 425,20.096"/>
    <polygon points="125,279.904 275,279.904 200,409.808"/>
  </g>
  <g font-family="Georgia, serif" font-size="28" text-anchor="middle" fill="#111827">
    <text x="125" y="202">1</text>
    <text x="200" y="246">3</text>
    <text x="275" y="202">4</text>
    <text x="350" y="246">5</text>
    <text x="425" y="202">6</text>
    <text x="500" y="246">Q</text>
    <text x="425" y="116">7</text>
    <text x="200" y="334">2</text>
  </g>
  <g fill="white" stroke-width="3">
    <circle cx="500" cy="150" r="8" stroke="#2563eb"/>
    <circle cx="275" cy="279.904" r="8" stroke="#c2410c"/>
  </g>
  <g font-family="Georgia, serif" font-size="25" font-weight="bold">
    <text x="520" y="144" fill="#1d4ed8">A</text>
    <text x="290" y="312" fill="#9a3412">B</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155">
    <text x="50" y="450">A: Q, 6, 7</text>
    <text x="300" y="450">B: 2, 3, 4, 5</text>
  </g>
</svg>
