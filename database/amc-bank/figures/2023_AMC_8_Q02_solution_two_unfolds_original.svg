<svg xmlns="http://www.w3.org/2000/svg" width="300" height="355" viewBox="0 0 300 355" role="img" aria-labelledby="title desc">
  <title id="title">After two unfolds</title>
  <desc id="desc">Opening the horizontal fold reflects the notched rectangle into the full 240-unit square. The two notches join to make a central diamond hole with four slanted cut edges. Dashed blue fold axes meet at B, the original square's center.</desc>
  <rect width="300" height="355" fill="white"/>
  <text x="150" y="30" font-family="Georgia, serif" font-size="19" fill="#111827" text-anchor="middle">After two unfolds</text>
  <path fill-rule="evenodd" d="M30 60 H270 V300 H30 Z M150 120 L210 180 L150 240 L90 180 Z" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 180 H270 M150 60 V300" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M150 120 L210 180 L150 240 L90 180 Z" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="150" cy="180" r="3" fill="#2563eb"/>
  <text x="158" y="200" font-family="Georgia, serif" font-size="19" fill="#111827">B</text>
</svg>
