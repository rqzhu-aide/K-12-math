<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-labelledby="title desc">
  <title id="title">Cut folded quarter</title>
  <desc id="desc">A 120-unit square quarter has the corner at the meeting of its right and bottom folds cut away. The slanted cut joins E on the bottom fold to F on the right fold. B marks the removed corner, originally the full square's center. Dashed blue lines show the folds.</desc>
  <rect width="300" height="220" fill="white"/>
  <text x="150" y="30" font-family="Georgia, serif" font-size="19" fill="#111827" text-anchor="middle">Cut folded quarter</text>
  <path d="M90 60 H210 V120 L150 180 H90 Z" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M90 180 H210 V60" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M150 180 L210 120" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="210" cy="180" r="3" fill="#2563eb"/>
  <g font-family="Georgia, serif" font-size="19" fill="#111827">
    <text x="136" y="200">E</text>
    <text x="216" y="118">F</text>
    <text x="218" y="200">B</text>
  </g>
</svg>
