<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Cube edge notation</title><desc id="desc">Bottom vertices 1, 2, 3, 4 in cyclic order, with corresponding top vertices. The front bottom edge is b1, vertical edge above vertex 1 is v1, and corresponding top edge is t1.</desc><rect width="600" height="420" fill="white"/><g fill="none" stroke="#18212b" stroke-width="3"><path d="M120 330H330L460 250V70L330 150H120Z M120 150L250 70H460 M330 150V330"/><path d="M120 330L250 250H460 M250 250V70" stroke-dasharray="7 6"/></g><g fill="#18212b" font-family="Georgia,serif" font-size="25" text-anchor="middle"><text x="106" y="360">1</text><text x="342" y="360">2</text><text x="482" y="265">3</text><text x="232" y="243">4</text><text x="102" y="143">1′</text><text x="340" y="139">2′</text><text x="480" y="69">3′</text><text x="238" y="59">4′</text><text x="224" y="365" font-style="italic">b₁</text><text x="88" y="252" font-style="italic">v₁</text><text x="224" y="136" font-style="italic">t₁</text></g></svg>